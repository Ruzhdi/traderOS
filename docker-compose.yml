services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traderos-api
    environment:
      APP_NAME: ${APP_NAME:-TraderOS API}
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+psycopg://traderos:traderos@db:5432/traderos}
      CELERY_BROKER_URL: ${CONTAINER_CELERY_BROKER_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traderos-worker
    command:
      [
        "celery",
        "-A",
        "app.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
      ]
    environment:
      APP_NAME: ${APP_NAME:-TraderOS API}
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+psycopg://traderos:traderos@db:5432/traderos}
      CELERY_BROKER_URL: ${CONTAINER_CELERY_BROKER_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    container_name: traderos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traderos}
      POSTGRES_USER: ${POSTGRES_USER:-traderos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traderos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-traderos} -d ${POSTGRES_DB:-traderos}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.4-alpine
    container_name: traderos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
