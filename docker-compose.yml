services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traderos-api
    environment:
      APP_NAME: ${APP_NAME:-TraderOS API}
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+psycopg://traderos:traderos@db:5432/traderos}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    container_name: traderos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traderos}
      POSTGRES_USER: ${POSTGRES_USER:-traderos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traderos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-traderos} -d ${POSTGRES_DB:-traderos}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
